services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: sqlite:////data/word_guess.db
      SQLITE_BUSY_TIMEOUT: "5000"
    volumes:
      - word_guess_data:/data
    init: true
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  word_guess_data:
